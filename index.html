<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================
         Viewport
    ====================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================
         Favicon / Site Icon
         ※ arumiran.png を正式採用
    ====================== -->
    <link rel="icon" href="/arumiran.png" sizes="any" />
    <link rel="icon" type="image/png" href="/arumiran.png" />
    <link rel="apple-touch-icon" href="/arumiran.png" />

    <!-- =====================
         Primary SEO
    ====================== -->
    <!-- 検索結果のサイト名として使われやすい -->
    <title>あるみらん / Almiran｜Portfolio</title>

    <meta
      name="description"
      content="漫画家・イラストレーター・映像クリエイター、あるみらん（Almiran）のポートフォリオ。商業漫画、オリジナルシリーズ、映像・イラスト制作実績を掲載。"
    />

    <meta name="robots" content="index,follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.arumiran.com/" />

    <!-- =====================
         Open Graph（OGP）
    ====================== -->
    <meta property="og:type" content="website" />

    <!-- サイト名（検索結果・SNS 両対応） -->
    <meta
      property="og:site_name"
      content="あるみらん / Almiran｜Portfolio"
    />

    <meta
      property="og:title"
      content="あるみらん / Almiran｜Portfolio"
    />

    <meta
      property="og:description"
      content="漫画・イラスト・映像を横断して活動する、あるみらん（Almiran）のポートフォリオ。"
    />

    <meta property="og:url" content="https://www.arumiran.com/" />

    <!-- OGP Image（サイトアイコンと統一） -->
    <meta
      property="og:image"
      content="https://www.arumiran.com/arumiran.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.arumiran.com/arumiran.png"
    />
    <meta property="og:image:type" content="image/png" />

    <!-- =====================
         Twitter Card
    ====================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="あるみらん / Almiran｜Portfolio"
    />
    <meta
      name="twitter:description"
      content="商業漫画、オリジナルシリーズ、映像・イラスト制作実績を掲載。"
    />
    <meta
      name="twitter:image"
      content="https://www.arumiran.com/arumiran.png"
    />

    <!-- =====================
         Theme Color
    ====================== -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FBF9F4" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
